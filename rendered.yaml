# Source: chaoscart/templates/order-db-migration.yaml
apiVersion: batch/v1
kind: Job

metadata:
  name: order-db-migration
  namespace: default
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      initContainers: 
        - name: wait-for-db 
          image: postgres:16-alpine 
          command: 
            - sh 
            - -c 
            - |
              until pg_isready -h postgres-order -p 5432
              do
                echo waiting for postgres
                sleep 2
              done

      containers:
      - name: migration

        image: "ghcr.io/devanshtyagi04/chaoscart-order-service:latest"

        command:
          - npx
          - prisma
          - migrate
          - deploy

        env:
          - name: DATABASE_URL
            value: "postgresql://postgres:postgres123@postgres-order:5432/chaoscart_orders"

          - name: DB_HOST
            value: "postgres-order"

          - name: DB_PORT
            value: "5432"

          - name: DB_NAME
            value: "chaoscart_orders"

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
