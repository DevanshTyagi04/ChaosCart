---
# Source: chaoscart/templates/order-service.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: chaoscart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service

        image: "ghcr.io/devanshtyagi04/chaoscart-order-service:latest"

        imagePullPolicy: Always

        env:
          - name: DB_HOST
            value: "postgres-order"

          - name: DB_PORT
            value: "5432"

          - name: DB_NAME
            value: "chaoscart_orders"

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD

        ports:
          - containerPort: 4003

        readinessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"
