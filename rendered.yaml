# Source: chaoscart/templates/ingess.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: chaoscart-ingress
  namespace: default

spec:
  ingressClassName: nginx

  rules:
    - host: localhost

      http:
        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend

                port:
                  number: 80

          - path: /api/users
            pathType: Prefix

            backend:
              service:
                name: user-service

                port:
                  number: 4001

          - path: /api/products
            pathType: Prefix

            backend:
              service:
                name: product-service

                port:
                  number: 4002

          - path: /api/orders
            pathType: Prefix

            backend:
              service:
                name: order-service

                port:
                  number: 4003
