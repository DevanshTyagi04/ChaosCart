apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: order-service

spec:
  selector:
    app: order-service

  ports:
    - name: http
      port: 4003
      targetPort: 4003

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.orderService.replicaCount }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service

        image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"

        imagePullPolicy: Always

        env:
        
          - name: DATABASE_URL
            value: "postgresql://postgres:postgres123@postgres-order:5432/{{ .Values.orderService.database.name }}"

          - name: DB_HOST
            value: {{ .Values.orderService.database.host | quote }}

          - name: DB_PORT
            value: {{ .Values.orderService.database.port | quote }}

          - name: DB_NAME
            value: {{ .Values.orderService.database.name | quote }}

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD

        ports:
          - containerPort: 4003

        readinessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"