apiVersion: batch/v1
kind: Job

metadata:
  name: order-db-migration
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      initContainers: 
        - name: wait-for-db 
          image: postgres:16-alpine 
          command: 
            - sh 
            - -c 
            - |
              until pg_isready -h postgres-order -p 5432
              do
                echo waiting for postgres
                sleep 2
              done

      containers:
      - name: migration

        image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"

        command:
          - npx
          - prisma
          - migrate
          - deploy

        env:
          - name: DATABASE_URL
            value: "postgresql://postgres:postgres123@postgres-order:5432/{{ .Values.orderService.database.name }}"

          - name: DB_HOST
            value: {{ .Values.orderService.database.host | quote }}

          - name: DB_PORT
            value: {{ .Values.orderService.database.port | quote }}

          - name: DB_NAME
            value: {{ .Values.orderService.database.name | quote }}

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD