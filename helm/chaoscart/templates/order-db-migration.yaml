apiVersion: batch/v1
kind: Job

metadata:
  name: order-db-migration
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
      - name: migration

        image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"

        command:
          - sh
          - -c
          - |
            until pg_isready -h postgres-order -p 5432
            do
              echo waiting for postgres
              sleep 2
            done

        env:
          - name: DB_HOST
            value: {{ .Values.orderService.database.host | quote }}

          - name: DB_PORT
            value: {{ .Values.orderService.database.port | quote }}

          - name: DB_NAME
            value: {{ .Values.orderService.database.name | quote }}

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD