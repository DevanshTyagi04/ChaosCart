apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: product-service

spec:
  selector:
    app: product-service

  ports:
    - name: http
      port: 4002
      targetPort: 4002

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.productService.replicaCount }}

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
      - name: product-service

        image: "{{ .Values.productService.image.repository }}:{{ .Values.productService.image.tag }}"

        imagePullPolicy: Always

        env:
          - name: DB_HOST
            value: {{ .Values.productService.database.host | quote }}

          - name: DB_PORT
            value: {{ .Values.productService.database.port | quote }}

          - name: DB_NAME
            value: {{ .Values.productService.database.name | quote }}

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD

        ports:
          - containerPort: 4002

        readinessProbe:
          httpGet:
            path: /health
            port: 4002
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 4002
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"