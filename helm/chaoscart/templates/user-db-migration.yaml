apiVersion: batch/v1
kind: Job

metadata:
  name: user-db-migration
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
      - name: migration

        image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"

        command:
          - npx
          - prisma
          - migrate
          - deploy

        env:
          - name: DB_HOST
            value: {{ .Values.userService.database.host | quote }}

          - name: DB_PORT
            value: {{ .Values.userService.database.port | quote }}

          - name: DB_NAME
            value: {{ .Values.userService.database.name | quote }}

          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD