services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - user-service
      - product-service
      - order-service
    restart: unless-stopped

  frontend:
    image: ghcr.io/devanshtyagi04/chaoscart-frontend:latest
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped

  user-service:
    image: ghcr.io/devanshtyagi04/chaoscart-user-service:latest
    env_file:
      - ./services/user-service/.env
    depends_on:
      - postgres-user
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/health').then(r => {if(r.ok) process.exit(0); else process.exit(1)}).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  product-service:
    image: ghcr.io/devanshtyagi04/chaoscart-product-service:latest
    env_file:
      - ./services/product-service/.env
    depends_on:
      - postgres-product
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4002/health').then(r => {if(r.ok) process.exit(0); else process.exit(1)}).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  order-service:
    image: ghcr.io/devanshtyagi04/chaoscart-order-service:latest
    env_file:
      - ./services/order-service/.env
    depends_on:
      - postgres-order
      - user-service
      - product-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4003/health').then(r => {if(r.ok) process.exit(0); else process.exit(1)}).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaoscart_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    restart: unless-stopped

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaoscart_products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    restart: unless-stopped

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaoscart_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped