name: Publish Docker Images

on:
  push:
    branches:
      - main
      - master

jobs:
  publish-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: ghcr.io/devanshtyagi04/chaoscart-user-service:latest

      - name: Build and Push Product Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/product-service
          push: true
          tags: ghcr.io/devanshtyagi04/chaoscart-product-service:latest

      - name: Build and Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          push: true
          tags: ghcr.io/devanshtyagi04/chaoscart-order-service:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/devanshtyagi04/chaoscart-frontend:latest