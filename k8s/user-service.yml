# user-service.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: chaoscart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:

      initContainers:
      - name: wait-for-db

        image: busybox:1.36

        command:
          - sh
          - -c
          - |
            until nc -z postgres-user 5432;
            do
              echo "Waiting for postgres..."
              sleep 2
            done

      containers:
      - name: user-service

        image: ghcr.io/devanshtyagi04/chaoscart-user-service:latest

        command:
          - npm
          - start

        ports:
        - containerPort: 4001

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: USER_DATABASE_URL

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /health
            port: 4001

          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 4001

          initialDelaySeconds: 15
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: chaoscart

spec:
  selector:
    app: user-service

  ports:
  - port: 4001
    targetPort: 4001

  type: ClusterIP