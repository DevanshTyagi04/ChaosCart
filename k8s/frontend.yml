apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chaoscart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: ghcr.io/devanshtyagi04/chaoscart-frontend:latest

          ports:
            - containerPort: 5173

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chaoscart

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 5173

  type: ClusterIP